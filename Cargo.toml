[package]
name = "krebslog"
version = "0.1.0"
edition = "2021"
description = "Metabolic reports, Krebs cycle visualizer & redox insights — CLI-first, local-only, LLM-agent primary interface"
repository = "https://github.com/argent0/krebslog"
homepage = "https://github.com/argent0/krebslog"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive", "env", "cargo", "string"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
comfy-table = "7.1"
colored = "2.1"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.10"

[features]
default = []
# images = ["dep:plotters"]  # future: enable rich image generation without pulling heavy deps for core

[[bin]]
name = "krebslog"
path = "src/main.rs"
